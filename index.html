<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Iconiser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html"><span class="brand-mark">N</span><span>Notion Iconiser</span></a>
        <span class="header-label">Image tools</span>
    </header>
    <main class="page-shell">
        <article class="content">
            <h1 id="pageTitle">Create a Notion-ready icon</h1>
            <p class="lede" id="pageDescription">Turn a square image into a clean, neutral icon with a transparent background.</p>
            <div class="divider"></div>
            <section id="upload">
                <h2 class="section-title" id="sectionTitle">Upload an image</h2>
                <p class="section-copy" id="sectionDescription">Choose a square image to begin. Your image will be processed automatically.</p>
                <button class="upload-area" id="uploadButton" type="button">
                    <span class="upload-prompt" id="uploadPrompt">
                        <span class="upload-icon" aria-hidden="true">↑</span>
                        <span class="upload-title">Choose a file or drop it here</span>
                        <span class="upload-hint">Square image files only</span>
                    </span>
                    <img class="processing-image" id="processingImage" alt="Uploaded image preview" hidden>
                    <span class="processing-status" id="processingStatus" aria-live="polite" hidden></span>
                    <span class="error" id="errorMessage" hidden>Image must be a square</span>
                </button>
                <input type="file" id="imageInput" accept="image/*" hidden>
                <a class="primary-button result-download" id="resultDownload" download="iconised-image.png" hidden>Download image</a>
            </section>
        </article>
    </main>
    <script type="module" src="script.js"></script>
</body>
</html>
