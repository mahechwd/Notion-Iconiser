<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download icon — Notion Iconiser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html"><span class="brand-mark">N</span><span>Notion Iconiser</span></a>
        <span class="header-label">Image tools</span>
    </header>
    <main class="page-shell">
        <aside class="sidebar" aria-label="Page contents">
            <p class="sidebar-title">In this tool</p>
            <span class="sidebar-item">Upload an image</span>
            <span class="sidebar-item">Remove background</span>
            <span class="sidebar-item active">Download icon</span>
        </aside>
        <article class="content">
            <h1>Your icon is ready</h1>
            <p class="lede">The background has been removed and the visible pixels have been converted to a neutral grey.</p>
            <div class="divider"></div>
            <section>
                <h2 class="section-title">Preview</h2>
                <p class="section-copy">The checkerboard shows the transparent areas of your image.</p>
                <div class="preview-frame"><img id="squareImage" alt="Edited square image"></div>
                <a class="primary-button" id="downloadLink" download="iconised-image.png">Download image</a>
            </section>
        </article>
    </main>
    <script>
        const squareImage = document.getElementById("squareImage");
        const downloadLink = document.getElementById("downloadLink");
        const editedImage = sessionStorage.getItem("editedImage");
        if (editedImage) {
            squareImage.src = editedImage;
            downloadLink.href = editedImage;
        } else {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
